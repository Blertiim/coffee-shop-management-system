services:
  - type: web
    name: coffee-shop-management-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render hosts run in UTC. The app works out business days from
      # BUSINESS_TIMEZONE (see backend/src/utils/business-day.js), so reports
      # are correct either way; TZ is set as well so log timestamps and any
      # plain date formatting read in the bar's local time too.
      - key: TZ
        value: Europe/Belgrade
      - key: BUSINESS_TIMEZONE
        value: Europe/Belgrade
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GUEST_ORDER_PUBLIC_BASE_URL
        sync: false
      - key: API_DOCS_ENABLED
        value: "false"
